# Pinned versions — the set this suite is green against (2026-08-05, 390 tests).
#
# `requirements.txt` stays as the loose declaration of intent. This file is what
# CI installs, because the graph's behaviour depends on library minor versions:
# `langgraph` owns the deferred-join semantics that `main.py` relies on, and
# `langchain-anthropic` owns the `thinking` kwarg that keeps agents from
# returning empty text. A `>=` range means a minor bump can change either one
# silently, with no lockfile to bisect against and — until today — no CI to
# catch it.
#
# Regenerate deliberately, not incidentally:
#   python3 -m pip freeze > requirements.lock   # then re-run the suite
